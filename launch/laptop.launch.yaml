%YAML 1.2
---
launch:
  - include:
      file: $(find-pkg-share neo_mpo_700-2)/configs/ur/ur_control.launch.py
      arg:
        - name: ur_type
          value: ur10e
        - name: robot_ip
          value: 192.168.100.102
        - name: reverse_ip
          value: 192.168.100.10
        - name: tf_prefix
          value: ur10e
        - name: use_mock_hardware
          value: "false"
        - name: mock_sensor_commands
          value: "false"
        - name: initial_joint_controller
          value: scaled_joint_trajectory_controller
        - name: controllers_file
          value: $(find-pkg-share neo_mpo_700-2)/configs/ur/ur_controllers.yaml
  - include:
      file: $(find-pkg-share ros2_vg10_gripper)/launch/vg10_node.launch.py
  - include:
      file: $(find-pkg-share neo_ur_moveit_config)/launch/neo_ur_moveit.launch.py
      arg:
        - name: robot_type
          value: mpo_700
        - name: arm_type
          value: ur10e
        - name: prefix
          value: ur10e
        - name: use_ur_dc
          value: "true"
        - name: gripper_type
          value: vg10
        - name: launch_rviz
          value: "false"
